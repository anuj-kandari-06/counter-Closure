
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Closure Counter</title>
</head>

<body>
    <div class="counter-box shadow p-3 mb-5 bg-body rounded">
        <h1 class="fs-1 fw-bold mb-5">Counter</h1>
        <div id="count">0</div>

        <button id="decrease" class="btn btn-danger m-1">−</button>
        <button id="reset" class="btn btn-secondary m-1">Reset</button>
        <button id="increase" class="btn btn-success m-1">+</button>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
